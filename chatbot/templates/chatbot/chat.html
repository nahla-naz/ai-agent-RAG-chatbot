{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant ✨</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
    }

    /* Smaller, more compact chat box */
    .chat-wrapper {
  position: fixed;
  bottom: 15px;
  right: 15px;
  width: 420px; 
  height: 460px; 
  background: white;
  border-radius: 0.75rem;
  box-shadow: 0 3px 12px rgba(0,0,0,0.15);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}




    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
      scroll-behavior: smooth;
    }

    .message {
  max-width: 90%; 
  word-wrap: break-word;
  font-size: 0.85rem;
  line-height: 1.3;
}

    .feedback-btn {
      opacity: 0.6;
      transition: opacity 0.2s, transform 0.2s;
    }
    .feedback-btn:hover {
      opacity: 1;
      transform: scale(1.05);
    }

    input, button {
      font-size: 0.85rem;
    }
  </style>
</head>
<body class="flex items-end justify-end min-h-screen">

  <!-- Chat Box -->
  <div class="chat-wrapper">
    <!-- Header -->
    <header class="bg-blue-600 text-white px-3 py-2 flex justify-between items-center">
      <h1 class="text-sm font-semibold">AI Assistant ✨</h1>
      <span class="text-[10px] opacity-80">Powered by Llama 3.2</span>
    </header>

    <!-- Chat Messages -->
    <main id="chat-box" class="chat-container space-y-2 bg-gray-50">
      <div class="flex justify-start">
        <div class="message bg-gray-200 text-gray-800 p-2 rounded-lg">
          Hi! 👋 How can I help you today?
        </div>
      </div>
    </main>

    <!-- Input -->
    <footer class="border-t border-gray-200 p-2 bg-white">
        <form id="chat-form" class="flex items-center space-x-2">
          <input id="user-input"
                 type="text"
                 name="message"
                 placeholder="Type your question... Tip: Use keywords"
                 required
                 class="flex-1 border border-gray-300 rounded-full px-2 py-1 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm placeholder:text-gray-400 placeholder:text-xs" />
          <button type="submit"
                  class="bg-blue-600 text-white px-3 py-1 rounded-full hover:bg-blue-700 transition text-sm">
            Send
          </button>
        </form>
      </footer>
      
      
      
  </div>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');
    const chatBox = document.getElementById('chat-box');
    
    // Submit chat form
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
    
      // User message
      const userMsg = document.createElement('div');
      userMsg.className = 'flex justify-end';
      userMsg.innerHTML = `
        <div class="message bg-blue-600 text-white p-2 rounded-lg text-sm shadow-sm">${message}</div>
      `;
      chatBox.appendChild(userMsg);
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;
    
      // Bot "thinking..."
      const botWrapper = document.createElement('div');
      botWrapper.className = 'flex justify-start';
      const botMessageDiv = document.createElement('div');
      botMessageDiv.className = 'message bg-gray-200 text-gray-800 p-2 rounded-lg italic text-sm shadow-sm';
      botMessageDiv.innerText = "Thinking...";
      botWrapper.appendChild(botMessageDiv);
      chatBox.appendChild(botWrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    
      const loadingMessages =[ "Thinking...",
                              "Analyzing your question...",
                              "Searching my memory...", 
                              "Almost ready...", 
                              "Just a moment...", 
                              "Generating response... (1)",
                              "Generating response... (2)",
                              "Generating response... (3)", 
                              "Generating response... (4)", 
                              "Generating response... (5)", 
                              "Generating response... (6)", 
                              "Generating response... (7)",
                              "Generating response... (8)",
                              "Generating response... (9)", 
                              "Generating response... (10)", ];
      let msgIndex = 0;
      const thinkingInterval = setInterval(() => {
        msgIndex = (msgIndex + 1) % loadingMessages.length;
        botMessageDiv.innerText = loadingMessages[msgIndex];
      }, 7000);
    
      // Fetch bot response
      const response = await fetch("{% url 'chat_response' %}", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": "{{ csrf_token }}",
        },
        body: JSON.stringify({ message }),
      });
    
      const data = await response.json();
      clearInterval(thinkingInterval);
    
      // Safely create message element (no inline JS)
      const botMsg = document.createElement('div');
      botMsg.className = 'message bg-gray-200 text-gray-800 p-2 rounded-lg text-sm shadow-sm';
      botMsg.dataset.reply = data.reply; // store reply safely in data attribute
      botMsg.innerHTML = `
        ${data.reply}
        <div class="flex items-center gap-2 mt-1 text-gray-500 text-xs">
          <button class="feedback-btn hover:text-green-600" data-feedback="like">👍</button>
          <button class="feedback-btn hover:text-green-600" data-feedback="dislike">👎</button>
        </div>
      `;
      botWrapper.innerHTML = '';
      botWrapper.appendChild(botMsg);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
    
    //  Global event listener (safe for dynamic content)
    chatBox.addEventListener('click', async (e) => {
      const btn = e.target.closest('.feedback-btn');
      if (!btn) return;
    
      const feedbackType = btn.dataset.feedback;
      const messageDiv = btn.closest('.message');
      const responseText = messageDiv?.dataset.reply;
    
      if (!responseText) return console.error('No response text found for feedback.');
    
      try {
        const res = await fetch("{% url 'chat_response' %}", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": "{{ csrf_token }}",
          },
          body: JSON.stringify({
            type: "feedback",
            response: responseText,
            feedback: feedbackType,
          }),
        });
    
        const data = await res.json();
        alert(data.message || "Feedback sent!");
      } catch (err) {
        console.error("Feedback error:", err);
      }
    });
    </script>
    
</body>
</html>
